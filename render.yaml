services:
  - type: web
    name: claychat
    runtime: docker
    plan: free
    healthCheckPath: /readyz
    envVars:
      - key: PORT
        value: "8080"
      - key: CHAT_DB_PATH
        value: /data/chat.db
      - key: CHAT_UPLOAD_DIR
        value: /data/uploads
      - key: MODEL_API_KEY
        sync: false
